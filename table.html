<!-- Tabel 2: Grid A-Z (Sesuai Gambar Terbaru) -->
<table class="grid-table">
    <tr>
        <td rowspan="3">A</td>
        <td rowspan="2">B</td>
        <td colspan="2">C</td>
        <td rowspan="3">D</td>
        <td rowspan="4">E</td>

        <td rowspan="6">H</td>
    </tr>

        <td>F</td>
        <td>G</td>
    </tr>
    <tr>
        <td>I</td>
        <td>J</td>
        <td>K</td>
        <td rowspan="2">O</td>
    </tr>
    <tr>
        <td colspan="5">M</td>
    </tr>
    <tr>
        <td rowspan="2">P</td>
        <td colspan="2">Q</td>
        <td rowspan="2" class="blue">R</td>
        <td>U</td>
        <td>V</td>
